<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@live-codes/ocaml-wasm — browser check</title>
    <style>
      body { font: 14px/1.5 ui-monospace, Consolas, monospace; background: #1b1b1f; color: #e6e6e9; padding: 24px; }
      pre { background: #232329; border: 1px solid #35353f; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
      h1 { font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>@live-codes/ocaml-wasm — browser check</h1>
    <p>Imports the package itself and runs programs through its API.</p>
    <pre id="log">running…</pre>

    <script type="module">
      import { createCompiler } from '../src/index.js';

      const log = document.getElementById('log');
      const lines = [];
      const say = (text) => {
        lines.push(text);
        log.textContent = lines.join('\n');
      };

      // The assets sit beside the package's assets/ dir, which the build stages.
      const baseUrl = new URL('../assets/', import.meta.url);

      const results = {};
      window.__check = results;

      // Post as we go: this browser is relaunched between commands, so a result
      // that only lives in the tab can be lost before anything reads it.
      const post = () =>
        fetch('/report', { method: 'POST', body: JSON.stringify(results) }).catch(() => {});
      post();

      try {
        const compiler = await createCompiler({ baseUrl });
        say(`ready: ${compiler.banner}`);

        // Each case gets its own timeout, so one hang does not hide the rest.
        const timed = (label, promise) =>
          Promise.race([
            promise,
            new Promise((resolve) =>
              setTimeout(() => resolve({ timedOut: true }), 10000)
            )
          ]).then((result) => {
            results[label] = result;
            const summary = result.timedOut
              ? 'TIMED OUT'
              : `exitCode=${result.exitCode} stdout=${JSON.stringify(result.stdout)}` +
                (result.diagnostics.length ? ` diagnostics=${JSON.stringify(result.diagnostics)}` : '');
            say(`${label} -> ${summary}`);
            post();
            return result;
          });

        await timed('plain', compiler.run('let () = print_endline "plain ok"'));
        await timed('filesArgsStdin', compiler.run(
          'let ic = open_in "nums.txt" in\n' +
            'let n = int_of_string (input_line ic) in\n' +
            'close_in ic;\n' +
            'let who = read_line () in\n' +
            'Printf.printf "%s, %s (%d)\\n" who Sys.argv.(1) (n * 2)',
          'Ada',
          { args: ['London'], files: [{ name: 'nums.txt', contents: '21\n' }] }
        ));
        await timed('library', compiler.run('let () = print_endline (Greet.hello "x")'));
        await timed('compileError', compiler.run('let x : int = "nope"'));
        await timed('warning', compiler.run('let f x = 1'));

        compiler.dispose();
        results.done = true;
        say('done');
        post();
      } catch (err) {
        results.error = String(err && err.message ? err.message : err);
        say(`FAILED: ${results.error}`);
        results.done = true;
        post();
      }
    </script>
  </body>
</html>
